name: 릴리스 브랜치 검사

# main 은 릴리스/마일스톤 브랜치다. 작업 브랜치가 develop 을 건너뛰고 바로 들어오는 것을 막는다.
# (CLAUDE.md 1장 — "develop → main 은 배포·마일스톤 시점에만 머지한다")
#
# 허용:
#   develop    정규 릴리스
#   hotfix/*   긴급 수정 (핫픽스 라벨 설명 "main 긴급 수정" 과 같은 맥락)
#
# 핫픽스를 막아두면 정작 급할 때 브랜치 보호를 통째로 꺼야 한다(enforce_admins 가 켜져 있어
# 관리자도 우회가 안 된다). 그건 가장 급한 순간에 가장 위험한 조작이라 처음부터 열어둔다.

# ⚠️ pull_request 가 아니라 pull_request_target 이다. 되돌리지 말 것.
#
# pull_request 는 "PR 의 머지 결과"에 있는 워크플로 파일을 실행한다. 즉 PR 안에서 이 파일을
# exit 0 으로 고쳐놓고 job 이름만 유지하면, 같은 이름의 필수 체크가 초록불로 통과해버린다.
# 검사 대상이 검사 규칙을 수정할 수 있는 구조라 필수 체크로서 의미가 없어진다.
#
# pull_request_target 은 항상 기본 브랜치(main)의 워크플로를 실행하므로 PR 이 손댈 수 없다.
# 이 워크플로는 PR 코드를 checkout 하지도 실행하지도 않아서 pull_request_target 의 통상적인
# 위험(신뢰되지 않은 코드가 상승된 권한으로 실행됨)에 해당하지 않는다.
#
# 대신 두 가지를 기억할 것.
#   - 이 가드는 워크플로가 main 에 올라간 뒤부터 동작한다 (기본 브랜치 기준이라서).
#   - 가드 자체를 고치는 변경은 PR 에서 미리 테스트할 수 없다. main 에 들어가야 반영된다.

on:
  pull_request_target:
    branches: [main]
    # edited 를 빼면 base 브랜치를 바꾸는 경로로 가드를 피할 수 있다.
    # develop 을 대상으로 PR 을 연 뒤(가드 안 돎) base 만 main 으로 바꾸면,
    # 기본 3종(opened·synchronize·reopened)에는 해당 전환이 없어 아무 이벤트도 안 뜬다.
    types: [opened, synchronize, reopened, edited]

# pull_request_target 은 기본적으로 read/write 토큰과 시크릿을 받는다.
# 이 잡은 이벤트 페이로드만 읽으므로 전부 회수한다.
permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: head 브랜치 확인
        # ${{ }} 를 셸에 직접 넣지 않고 env 로 받는다. 브랜치 이름에 셸 메타문자가 섞여도
        # 스크립트 인젝션이 되지 않게 하기 위함 (pull_request_target 이라 더 중요하다).
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -eu

          # 포크에서 온 PR 은 브랜치 이름과 무관하게 막는다.
          # 이 레포는 Public 이라 누구나 포크할 수 있고, 포크에 develop 이라는 브랜치를
          # 만들면 head_ref 가 "develop" 으로 들어와 아래 검사를 그냥 통과한다.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo ""
            echo "  ✗ 포크에서 main 으로 직접 PR 을 보낼 수 없습니다."
            echo ""
            echo "    head 저장소: $HEAD_REPO"
            echo "    이 저장소:   $BASE_REPO"
            echo ""
            echo "  기여하시려면 develop 을 대상으로 PR 을 보내주세요."
            echo ""
            exit 1
          fi

          if [ "$HEAD_REF" = "develop" ]; then
            echo "✓ develop → main 정규 릴리스 PR 입니다."
            exit 0
          fi

          case "$HEAD_REF" in
            hotfix/*)
              echo "✓ 핫픽스 PR 입니다: $HEAD_REF"
              echo ""
              echo "  ⚠️  머지한 뒤 develop 에도 반드시 반영하세요."
              echo ""
              echo "      핫픽스는 main 에만 들어가므로, 그대로 두면 develop 에는 수정이 없습니다."
              echo "      다음 릴리스에서 이 수정이 되돌아간 것처럼 보이게 됩니다."
              echo "      main 을 develop 으로 머지하는 PR 을 따로 올려주세요."
              echo ""
              exit 0
              ;;
          esac

          echo ""
          echo "  ✗ main 으로 오는 PR 은 develop 또는 hotfix/* 에서만 올릴 수 있습니다."
          echo ""
          echo "    현재 head 브랜치: $HEAD_REF"
          echo ""
          echo "  main 은 릴리스/마일스톤 브랜치입니다. 일반 작업 브랜치는 develop 으로 보내주세요."
          echo "  이 PR 을 그대로 옮기려면 GitHub PR 화면에서 base 를 develop 으로 바꾸면 됩니다."
          echo "  (Edit 버튼 옆 base 드롭다운 — PR 번호와 리뷰가 유지됩니다)"
          echo ""
          echo "  자세한 규칙은 CLAUDE.md 1장 \"Git Flow\" 참고."
          echo ""
          exit 1
